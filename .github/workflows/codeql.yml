name: CodeQL

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.runner }}
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
            runner: ubuntu-latest
          # Build the Swift package directly. Autobuild tries CocoaPods and the
          # test app's Xcode project first, which costs ~25 minutes.
          - language: swift
            build-mode: manual
            runner: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          debug: true

      - if: matrix.build-mode == 'manual'
        run: swift build -v

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
